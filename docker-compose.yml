services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    # Portainer creates stack.env from the UI; local runs use .env.
    # Both optional so either path can deploy alone.
    env_file:
      - path: stack.env
        required: false
      - path: .env
        required: false
    environment:
      DB_PATH: /app/data/bot.db
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - bot-data:/app/data

volumes:
  bot-data:
