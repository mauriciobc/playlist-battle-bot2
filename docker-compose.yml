services:
  bot:
    build:
      context: .
      args:
        # Baked into the image as ENV GIT_SHA → startup log shows which commit
        # is running. Set GIT_SHA=$(git rev-parse --short HEAD) in .env/stack.env
        # (or leave unset → "dev").
        GIT_SHA: ${GIT_SHA:-dev}
    # Without this, `docker compose up -d` (and Portainer's stack update) reuses
    # the image already on the host and silently keeps running the previous
    # commit's code. Always rebuild from the checked-out source on up.
    pull_policy: build
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    # Portainer creates stack.env from the UI; local runs use .env.
    # Both optional so either path can deploy alone.
    env_file:
      - path: stack.env
        required: false
      - path: .env
        required: false
    environment:
      DB_PATH: /app/data/bot.db
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - bot-data:/app/data

volumes:
  bot-data:
