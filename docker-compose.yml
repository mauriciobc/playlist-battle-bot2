services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file: .env
    environment:
      DB_PATH: /app/data/bot.db
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - bot-data:/app/data

volumes:
  bot-data:
